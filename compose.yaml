services:
  postizmcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: postiz-mcp:local
    ports:
      - 3084:3084
    restart: unless-stopped
    environment:
      PORT: 3084
      POSTIZ_API_URL: https://postiz.oculair.ca/api
      POSTIZ_API_KEY: 255364482e25a51ff9a6660135b8c88995e7ae68615fb9a67ad14d601f8fe0ff
      NODE_ENV: ${NODE_ENV:-production}
    labels:
      - homepage.group=MCP Services
      - homepage.name=Postiz MCP
      - homepage.icon=si-social
      - homepage.href=http://192.168.50.90:3084
      - homepage.description=Postiz social media MCP server
networks: {}
